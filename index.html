<!DOCTYPE html>
<html lang="es" class="h-full bg-[#0a0a0c] text-zinc-100 antialiased selection:bg-zinc-800 selection:text-white">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0c" />
  <title>Barbería El Barrio — Reserva de Cita</title>

  <!-- Tipografía: Inter limpia y directa -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            surface: {
              DEFAULT: '#111114',
              card: '#16161a',
              border: '#242429',
              hover: '#1d1d22'
            }
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      padding-bottom: calc(100px + env(safe-area-inset-bottom, 20px));
    }
    input, button, select, textarea {
      touch-action: manipulation;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="min-h-full flex flex-col justify-between font-sans bg-[#0a0a0c] text-zinc-100">

  <div class="w-full max-w-md mx-auto px-4 pt-5 sm:px-5 space-y-6">

    <!-- ===================================================================================
         CABECERA LIMPIA Y REALISTA (SIN MARKETING SLOP)
         =================================================================================== -->
    <header class="flex items-start justify-between pb-4 border-b border-zinc-800">
      <div>
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span class="text-xs text-zinc-400 font-medium" id="txt-status">Abierto hoy · 10:00 a 20:00</span>
        </div>
        <h1 class="text-xl font-bold text-white tracking-tight mt-1" id="txt-shop-name">Barbería El Barrio</h1>
        <p class="text-xs text-zinc-400 mt-0.5" id="txt-shop-address">Calle Mayor, 14 · Casco Antiguo</p>
      </div>

      <!-- Selector de idioma ES / EN -->
      <div class="flex items-center bg-zinc-900 border border-zinc-800 rounded-lg p-0.5 text-xs font-semibold">
        <button id="btn-lang-es" onclick="setLanguage('es')" class="px-2.5 py-1 rounded-[6px] bg-zinc-800 text-white transition-all">
          ES
        </button>
        <button id="btn-lang-en" onclick="setLanguage('en')" class="px-2.5 py-1 rounded-[6px] text-zinc-400 hover:text-white transition-all">
          EN
        </button>
      </div>
    </header>

    <!-- ===================================================================================
         FLUJO DE RESERVA DIRECTO Y FUNCIONAL
         =================================================================================== -->
    <main class="space-y-6">

      <!-- PASO 1: SERVICIOS -->
      <section class="space-y-2.5">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-400" id="title-step-1">1. Servicio</h2>
        <div class="space-y-2" id="services-container">
          <!-- Inyectado por JS -->
        </div>
      </section>

      <!-- PASO 2: DÍA Y HORA -->
      <section class="space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-400" id="title-step-2">2. Día y hora</h2>
          <span class="text-xs text-zinc-300 font-medium" id="selected-date-summary"></span>
        </div>

        <!-- Días -->
        <div class="flex gap-2 overflow-x-auto no-scrollbar py-0.5 -mx-1 px-1" id="days-container"></div>

        <!-- Horas -->
        <div class="space-y-3 pt-1">
          <div>
            <span class="text-[11px] font-medium text-zinc-500 block mb-1.5" id="txt-shift-morning">Mañana</span>
            <div class="grid grid-cols-4 gap-1.5" id="morning-slots-container"></div>
          </div>
          <div>
            <span class="text-[11px] font-medium text-zinc-500 block mb-1.5" id="txt-shift-afternoon">Tarde</span>
            <div class="grid grid-cols-4 gap-1.5" id="afternoon-slots-container"></div>
          </div>
        </div>
      </section>

      <!-- PASO 3: TUS DATOS -->
      <section class="space-y-2.5">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-400" id="title-step-3">3. Tus datos</h2>
        
        <div class="space-y-2.5 bg-surface-card border border-surface-border p-3.5 rounded-xl">
          <div>
            <label for="client-name" class="block text-xs text-zinc-400 mb-1" id="lbl-name">Nombre y apellido</label>
            <input
              type="text"
              id="client-name"
              autocomplete="name"
              placeholder="Ej. Carlos Mendoza"
              class="w-full h-11 bg-zinc-950 border border-zinc-800 rounded-lg px-3 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-zinc-500 transition-colors"
              oninput="validateForm()"
            />
          </div>

          <div>
            <label for="client-phone" class="block text-xs text-zinc-400 mb-1" id="lbl-phone">Teléfono (WhatsApp)</label>
            <input
              type="tel"
              id="client-phone"
              autocomplete="tel"
              placeholder="Ej. 612 345 678"
              class="w-full h-11 bg-zinc-950 border border-zinc-800 rounded-lg px-3 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-zinc-500 transition-colors"
              oninput="validateForm()"
            />
          </div>
        </div>
      </section>

      <!-- AVISO SOBER Y DIRECTO -->
      <section class="pt-1">
        <div class="p-3 rounded-lg bg-zinc-900/60 border border-zinc-800/80 flex items-center justify-between text-xs text-zinc-400">
          <span id="txt-payment-notice">Pago en el local (Efectivo / Bizum)</span>
          <a
            href="https://maps.google.com/?q=Calle+Mayor+14"
            target="_blank"
            rel="noopener noreferrer"
            class="text-zinc-300 hover:text-white underline underline-offset-2"
          >
            Google Maps
          </a>
        </div>
      </section>

    </main>

    <!-- FOOTER SUTIL -->
    <footer class="pt-2 pb-6 text-center text-xs text-zinc-600">
      <p id="txt-footer-policy">Barbería El Barrio · Si no puedes asistir, avisa con antelación</p>
    </footer>

  </div>

  <!-- ===================================================================================
       BARRA FIJA INFERIOR (RESUMEN Y BOTÓN)
       =================================================================================== -->
  <div class="fixed bottom-0 inset-x-0 bg-[#0a0a0c]/95 backdrop-blur-md border-t border-zinc-800 p-3.5 z-50">
    <div class="w-full max-w-md mx-auto flex items-center gap-3">
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold text-white truncate" id="sticky-service-label">Corte clásico</span>
          <span class="text-xs font-bold text-zinc-300 shrink-0" id="sticky-price-label">15 €</span>
        </div>
        <p class="text-[11px] text-zinc-400 truncate mt-0.5" id="sticky-date-label">Elige día y hora</p>
      </div>

      <button
        id="btn-submit"
        type="button"
        onclick="handleBookingConfirmation()"
        disabled
        class="h-11 px-4 bg-white hover:bg-zinc-200 text-black font-semibold rounded-lg text-xs transition-colors flex items-center justify-center gap-2 disabled:opacity-30 disabled:cursor-not-allowed shrink-0"
      >
        <svg class="w-4 h-4 text-black" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2zm5.8 14.16c-.24.68-1.4 1.25-1.92 1.33-.5.07-1.14.1-3.32-.8-2.6-1.08-4.27-3.72-4.4-3.89-.13-.17-1.06-1.41-1.06-2.69 0-1.28.67-1.91.91-2.17.24-.26.53-.33.7-.33.18 0 .36.01.52.01.17 0 .4-.06.62.47.24.57.81 1.97.88 2.12.07.15.12.33.02.53-.1.2-.15.33-.3.51-.15.17-.32.39-.46.52-.15.15-.31.31-.13.62.18.31.8 1.32 1.72 2.14 1.18 1.05 2.18 1.38 2.49 1.53.31.15.49.13.67-.08.18-.21.78-.91.99-1.22.21-.31.42-.26.7-.15.28.11 1.79.84 2.1 1 .31.15.52.23.6.36.07.14.07.8-.17 1.48z"/>
        </svg>
        <span id="txt-cta-button">Confirmar cita</span>
      </button>
    </div>
  </div>

  <!-- Scripts modulares -->
  <script src="./barber-config.js"></script>
  <script src="./whatsapp-booking.js"></script>

  <script>
    const state = {
      lang: 'es',
      selectedServiceId: 1,
      selectedDate: null,
      selectedTime: null,
      clientName: '',
      clientPhone: ''
    };

    const i18n = {
      es: {
        shopName: "Barbería El Barrio",
        status: "Abierto hoy · 10:00 a 20:00",
        address: "Calle Mayor, 14 · Casco Antiguo",
        step1Title: "1. Servicio",
        step2Title: "2. Día y hora",
        step3Title: "3. Tus datos",
        lblName: "Nombre y apellido",
        namePlaceholder: "Ej. Carlos Mendoza",
        lblPhone: "Teléfono (WhatsApp)",
        phonePlaceholder: "Ej. 612 345 678",
        shiftMorning: "Mañana",
        shiftAfternoon: "Tarde",
        paymentNotice: "Pago en el local (Efectivo / Bizum)",
        footerPolicy: "Barbería El Barrio · Si no puedes asistir, avisa con antelación",
        closedDay: "Cerrado este día",
        ctaButton: "Confirmar cita",
        chooseDatePrompt: "Elige día y hora",
        services: [
          { id: 1, name: "Corte de pelo", duration: "30 min", price: "15 €" },
          { id: 2, name: "Corte + Barba", duration: "45 min", price: "24 €" },
          { id: 3, name: "Arreglo de barba", duration: "20 min", price: "12 €" },
          { id: 4, name: "Corte infantil / Jubilado", duration: "25 min", price: "13 €" }
        ],
        daysShort: ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"],
        monthsShort: ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"],
        today: "Hoy",
        tomorrow: "Mañana"
      },
      en: {
        shopName: "El Barrio Barbershop",
        status: "Open today · 10:00 AM to 8:00 PM",
        address: "14 Main St · Old Town",
        step1Title: "1. Service",
        step2Title: "2. Date & Time",
        step3Title: "3. Your Details",
        lblName: "Full name",
        namePlaceholder: "e.g. John Miller",
        lblPhone: "Phone (WhatsApp)",
        phonePlaceholder: "e.g. +34 612 345 678",
        shiftMorning: "Morning",
        shiftAfternoon: "Afternoon",
        paymentNotice: "Pay in person (Cash / Bizum)",
        footerPolicy: "El Barrio Barbershop · Please cancel in advance if needed",
        closedDay: "Closed on this date",
        ctaButton: "Confirm booking",
        chooseDatePrompt: "Select date and time",
        services: [
          { id: 1, name: "Haircut", duration: "30 min", price: "15 €" },
          { id: 2, name: "Haircut + Beard", duration: "45 min", price: "24 €" },
          { id: 3, name: "Beard Trim", duration: "20 min", price: "12 €" },
          { id: 4, name: "Kids / Senior Cut", duration: "25 min", price: "13 €" }
        ],
        daysShort: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
        monthsShort: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dec"],
        today: "Today",
        tomorrow: "Tomorrow"
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      renderServices();
      generateCalendarDays();
      updateLanguageTexts();
      validateForm();
    });

    function setLanguage(lang) {
      if (state.lang === lang) return;
      state.lang = lang;
      window.currentLanguage = lang;
      document.documentElement.lang = lang;

      const btnEs = document.getElementById('btn-lang-es');
      const btnEn = document.getElementById('btn-lang-en');

      if (lang === 'es') {
        btnEs.className = "px-2.5 py-1 rounded-[6px] bg-zinc-800 text-white transition-all";
        btnEn.className = "px-2.5 py-1 rounded-[6px] text-zinc-400 hover:text-white transition-all";
      } else {
        btnEn.className = "px-2.5 py-1 rounded-[6px] bg-zinc-800 text-white transition-all";
        btnEs.className = "px-2.5 py-1 rounded-[6px] text-zinc-400 hover:text-white transition-all";
      }

      updateLanguageTexts();
      renderServices();
      generateCalendarDays();
      validateForm();
    }

    function updateLanguageTexts() {
      const t = i18n[state.lang];
      document.getElementById('txt-shop-name').textContent = t.shopName;
      document.getElementById('txt-status').textContent = t.status;
      document.getElementById('txt-shop-address').textContent = t.address;
      document.getElementById('title-step-1').textContent = t.step1Title;
      document.getElementById('title-step-2').textContent = t.step2Title;
      document.getElementById('title-step-3').textContent = t.step3Title;
      document.getElementById('lbl-name').textContent = t.lblName;
      document.getElementById('client-name').placeholder = t.namePlaceholder;
      document.getElementById('lbl-phone').textContent = t.lblPhone;
      document.getElementById('client-phone').placeholder = t.phonePlaceholder;
      document.getElementById('txt-shift-morning').textContent = t.shiftMorning;
      document.getElementById('txt-shift-afternoon').textContent = t.shiftAfternoon;
      document.getElementById('txt-payment-notice').textContent = t.paymentNotice;
      document.getElementById('txt-footer-policy').textContent = t.footerPolicy;
      document.getElementById('txt-cta-button').textContent = t.ctaButton;
      updateStickyBar();
    }

    function renderServices() {
      const container = document.getElementById('services-container');
      const services = i18n[state.lang].services;

      container.innerHTML = services.map(service => {
        const isSelected = state.selectedServiceId === service.id;

        const cardStyle = isSelected
          ? 'bg-zinc-900 border-zinc-200 text-white'
          : 'bg-surface-card border-surface-border text-zinc-300 hover:border-zinc-700';

        const radioStyle = isSelected
          ? 'w-4 h-4 rounded-full bg-white flex items-center justify-center'
          : 'w-4 h-4 rounded-full border border-zinc-600';

        const radioInner = isSelected
          ? '<div class="w-1.5 h-1.5 rounded-full bg-black"></div>'
          : '';

        return `
          <div 
            onclick="selectService(${service.id})"
            class="p-3.5 rounded-xl border transition-colors cursor-pointer flex items-center justify-between ${cardStyle}"
          >
            <div class="flex items-center gap-2">
              <span class="font-medium text-sm text-white">${service.name}</span>
              <span class="text-xs text-zinc-400">· ${service.duration}</span>
            </div>
            <div class="flex items-center gap-3 shrink-0">
              <span class="text-sm font-semibold text-white">${service.price}</span>
              <div class="${radioStyle}">${radioInner}</div>
            </div>
          </div>
        `;
      }).join('');

      updateStickyBar();
    }

    function selectService(id) {
      state.selectedServiceId = id;
      renderServices();
      validateForm();
    }

    function generateCalendarDays() {
      const container = document.getElementById('days-container');
      const t = i18n[state.lang];
      const days = [];
      const today = new Date();

      let count = 0;
      let offset = 0;

      while (count < 7) {
        const d = new Date();
        d.setDate(today.getDate() + offset);
        offset++;

        const dKey = formatDateKey(d);
        if (d.getDay() === 0 || (typeof BARBER_SCHEDULE_CONFIG !== 'undefined' && BARBER_SCHEDULE_CONFIG.closedDates.includes(dKey))) {
          continue;
        }

        days.push(d);
        count++;
      }

      if (!state.selectedDate && days.length > 0) {
        state.selectedDate = formatDateKey(days[0]);
      }

      container.innerHTML = days.map((d, index) => {
        const dateKey = formatDateKey(d);
        const isSelected = state.selectedDate === dateKey;
        const dayOfWeek = index === 0 ? t.today : (index === 1 ? t.tomorrow : t.daysShort[d.getDay()]);
        const dayNum = d.getDate();
        const month = t.monthsShort[d.getMonth()];

        const cardStyle = isSelected
          ? 'bg-white text-black font-semibold shadow-sm'
          : 'bg-surface-card border border-surface-border text-zinc-300 hover:border-zinc-700';

        const subTextStyle = isSelected ? 'text-zinc-800' : 'text-zinc-500';

        return `
          <button
            type="button"
            onclick="selectDate('${dateKey}')"
            class="flex-shrink-0 flex flex-col items-center justify-center w-16 py-2.5 rounded-xl transition-colors ${cardStyle}"
          >
            <span class="text-[10px] uppercase tracking-wider ${subTextStyle}">${dayOfWeek}</span>
            <span class="text-base font-bold my-0.5 leading-none">${dayNum}</span>
            <span class="text-[10px] ${subTextStyle}">${month}</span>
          </button>
        `;
      }).join('');

      renderTimeSlotsForSelectedDate();
      updateDateSummary();
    }

    function selectDate(dateKey) {
      state.selectedDate = dateKey;
      state.selectedTime = null;
      generateCalendarDays();
      validateForm();
    }

    function formatDateKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function updateDateSummary() {
      if (!state.selectedDate) return;
      const [y, m, d] = state.selectedDate.split('-').map(Number);
      const dateObj = new Date(y, m - 1, d);
      const t = i18n[state.lang];
      const dayName = t.daysShort[dateObj.getDay()];
      const monthName = t.monthsShort[dateObj.getMonth()];

      const summaryEl = document.getElementById('selected-date-summary');
      summaryEl.textContent = `${dayName}, ${d} ${monthName} ${state.selectedTime ? '· ' + state.selectedTime : ''}`;
      updateStickyBar();
    }

    function renderTimeSlotsForSelectedDate() {
      const morningEl = document.getElementById('morning-slots-container');
      const afternoonEl = document.getElementById('afternoon-slots-container');
      if (!state.selectedDate) return;

      const slots = (typeof getDayTimeSlots === 'function')
        ? getDayTimeSlots(state.selectedDate)
        : [];

      if (slots.length === 0) {
        morningEl.innerHTML = `<div class="col-span-4 py-3 text-center text-xs text-zinc-500 bg-surface-card border border-zinc-800 rounded-lg">${i18n[state.lang].closedDay}</div>`;
        afternoonEl.innerHTML = '';
        return;
      }

      const morningSlots = slots.filter(s => {
        const hour = parseInt(s.time.split(':')[0], 10);
        return hour < 15;
      });

      const afternoonSlots = slots.filter(s => {
        const hour = parseInt(s.time.split(':')[0], 10);
        return hour >= 15;
      });

      const renderSlotButton = (slot) => {
        const isSelected = state.selectedTime === slot.time;

        if (!slot.isAvailable) {
          return `
            <button
              type="button"
              disabled
              class="h-10 text-xs rounded-lg bg-zinc-950 border border-zinc-900 text-zinc-600 line-through cursor-not-allowed opacity-30 select-none"
            >
              ${slot.time}
            </button>
          `;
        }

        const activeStyle = isSelected
          ? 'bg-white text-black font-semibold'
          : 'bg-surface-card border border-surface-border text-zinc-200 hover:border-zinc-700';

        return `
          <button
            type="button"
            onclick="selectTime('${slot.time}')"
            class="h-10 text-xs font-medium rounded-lg transition-colors flex items-center justify-center ${activeStyle}"
          >
            ${slot.time}
          </button>
        `;
      };

      morningEl.innerHTML = morningSlots.map(renderSlotButton).join('');
      afternoonEl.innerHTML = afternoonSlots.length > 0
        ? afternoonSlots.map(renderSlotButton).join('')
        : `<p class="col-span-4 text-center text-xs text-zinc-600 py-1">Sin turnos de tarde</p>`;
    }

    function selectTime(time) {
      state.selectedTime = time;
      renderTimeSlotsForSelectedDate();
      updateDateSummary();
      validateForm();
    }

    function updateStickyBar() {
      const t = i18n[state.lang];
      const service = t.services.find(s => s.id === state.selectedServiceId);

      const serviceLabel = document.getElementById('sticky-service-label');
      const priceLabel = document.getElementById('sticky-price-label');
      const dateLabel = document.getElementById('sticky-date-label');

      if (service && serviceLabel && priceLabel) {
        serviceLabel.textContent = service.name;
        priceLabel.textContent = service.price;
      }

      if (dateLabel) {
        if (state.selectedDate && state.selectedTime) {
          const [y, m, d] = state.selectedDate.split('-').map(Number);
          const dateObj = new Date(y, m - 1, d);
          dateLabel.textContent = `${t.daysShort[dateObj.getDay()]}, ${d} ${t.monthsShort[dateObj.getMonth()]} · ${state.selectedTime}`;
          dateLabel.className = "text-[11px] text-white font-medium truncate mt-0.5";
        } else {
          dateLabel.textContent = t.chooseDatePrompt;
          dateLabel.className = "text-[11px] text-zinc-400 truncate mt-0.5";
        }
      }
    }

    function validateForm() {
      state.clientName = document.getElementById('client-name').value.trim();
      state.clientPhone = document.getElementById('client-phone').value.trim();

      const phoneDigits = state.clientPhone.replace(/\D/g, '');
      const hasValidPhone = phoneDigits.length >= 8;
      const hasValidName = state.clientName.length >= 3;

      const isValid = (
        state.selectedServiceId !== null &&
        state.selectedDate !== null &&
        state.selectedTime !== null &&
        hasValidName &&
        hasValidPhone
      );

      const btn = document.getElementById('btn-submit');
      btn.disabled = !isValid;
    }

    function handleBookingConfirmation() {
      const t = i18n[state.lang];
      const service = t.services.find(s => s.id === state.selectedServiceId);

      if (!service || !state.selectedDate || !state.selectedTime || !state.clientName || !state.clientPhone) {
        return;
      }

      const [y, m, d] = state.selectedDate.split('-').map(Number);
      const dateObj = new Date(y, m - 1, d);
      const dateFormatted = `${t.daysShort[dateObj.getDay()]}, ${d} de ${t.monthsShort[dateObj.getMonth()]} ${y}`;

      const bookingPayload = {
        lang: state.lang,
        serviceName: `${service.name} (${service.price} · ${service.duration})`,
        dateFormatted: dateFormatted,
        time: state.selectedTime,
        clientName: state.clientName,
        clientPhone: state.clientPhone
      };

      if (typeof BOOKING_CONFIG !== 'undefined' && typeof BARBER_SCHEDULE_CONFIG !== 'undefined') {
        BOOKING_CONFIG.barberPhoneNumber = BARBER_SCHEDULE_CONFIG.whatsappPhone;
      }

      if (typeof window.handleBookingConfirmation === 'function' && window.handleBookingConfirmation !== handleBookingConfirmation) {
        window.handleBookingConfirmation(bookingPayload);
      } else {
        const phone = (typeof BARBER_SCHEDULE_CONFIG !== 'undefined' ? BARBER_SCHEDULE_CONFIG.whatsappPhone : '34600112233');
        const msg = state.lang === 'en'
          ? `Hello, I would like to book an appointment: ${bookingPayload.serviceName} on ${dateFormatted} at ${state.selectedTime}. Name: ${state.clientName}. Phone: ${state.clientPhone}.`
          : `Hola, quiero reservar una cita: ${bookingPayload.serviceName} el ${dateFormatted} a las ${state.selectedTime}. A nombre de: ${state.clientName}. Mi teléfono: ${state.clientPhone}.`;

        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
      }
    }
  </script>
</body>
</html>
