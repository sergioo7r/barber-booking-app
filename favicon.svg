<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Warm artisanal Kraft/Sand background -->
    <radialGradient id="kraftBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ebd1b0"/>
      <stop offset="65%" stop-color="#d4a36e"/>
      <stop offset="100%" stop-color="#b68048"/>
    </radialGradient>

    <!-- Path for smooth arched top text -->
    <path id="textArch" d="M 46,165 A 114,114 0 0,1 254,165" fill="none"/>
  </defs>

  <!-- Octagon Base -->
  <polygon points="90,14 210,14 286,90 286,210 210,286 90,286 14,210 14,90" fill="url(#kraftBg)" stroke="#7c4e20" stroke-width="3"/>
  <polygon points="93,21 207,21 279,93 279,207 207,279 93,279 21,207 21,93" fill="none" stroke="#5a3614" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Arched Text: THINK UNLIMITED BARBERSHOP -->
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="13.2" letter-spacing="3.2" fill="#18130e">
    <textPath href="#textArch" startOffset="50%" text-anchor="middle">THINK UNLIMITED BARBERSHOP</textPath>
  </text>

  <!-- 7 Stars in smooth Arc -->
  <g fill="#18130e">
    <!-- Star 1 (Left) -->
    <polygon points="68,96 71.5,90 78,89.5 73,85 74.5,79 69,82 63.5,79 65,85 60,89.5 66.5,90" transform="rotate(-30 69 88)"/>
    <!-- Star 2 -->
    <polygon points="91,73 94.5,67 101,66.5 96,62 97.5,56 92,59 86.5,56 88,62 83,66.5 89.5,67" transform="rotate(-20 92 65)"/>
    <!-- Star 3 -->
    <polygon points="119,57 122.5,51 129,50.5 124,46 125.5,40 120,43 114.5,40 116,46 111,50.5 117.5,51" transform="rotate(-10 120 49)"/>
    <!-- Star 4 (Apex) -->
    <polygon points="150,51 154,44 162,43 156,38 158,30 150,34 142,30 144,38 138,43 146,44"/>
    <!-- Star 5 -->
    <polygon points="181,57 184.5,51 191,50.5 186,46 187.5,40 182,43 176.5,40 178,46 173,50.5 179.5,51" transform="rotate(10 180 49)"/>
    <!-- Star 6 -->
    <polygon points="209,73 212.5,67 219,66.5 214,62 215.5,56 210,59 204.5,56 206,62 201,66.5 207.5,67" transform="rotate(20 208 65)"/>
    <!-- Star 7 (Right) -->
    <polygon points="232,96 235.5,90 242,89.5 237,85 238.5,79 233,82 227.5,79 229,85 224,89.5 230.5,90" transform="rotate(30 231 88)"/>
  </g>

  <!-- Horizontal Razor Accent Lines -->
  <g stroke="#18130e" stroke-width="3.5" stroke-linecap="round">
    <!-- Left lines -->
    <line x1="50" y1="135" x2="88" y2="135"/>
    <line x1="56" y1="146" x2="84" y2="146"/>
    <line x1="62" y1="157" x2="80" y2="157"/>

    <!-- Right lines -->
    <line x1="212" y1="135" x2="250" y2="135"/>
    <line x1="216" y1="146" x2="244" y2="146"/>
    <line x1="220" y1="157" x2="238" y2="157"/>
  </g>

  <!-- Center Gentleman Barber Silhouette -->
  <g fill="#18130e">
    <!-- Hair Pompadour -->
    <path d="M125 94 C120 72 132 60 150 60 C168 60 183 68 183 82 C183 89 178 94 174 97 C170 93 166 90 160 90 C150 90 140 95 134 102 C130 98 127 96 125 94 Z"/>
    
    <!-- Forehead & Nose profile -->
    <path d="M132 99 C136 96 142 96 148 97 C152 98 155 101 155 105 L152 112 L160 113 L162 122 L150 123 C148 126 145 128 141 129 C137 130 131 128 131 123 C127 121 125 117 125 112 C125 107 128 102 132 99 Z"/>

    <!-- Sunglasses (Wayfarer style) -->
    <path d="M133 106 Q146 103 159 108 Q162 115 157 120 Q146 123 136 118 Q131 113 133 106 Z" fill="#ebd1b0" stroke="#18130e" stroke-width="3.8"/>
    <path d="M133 110 L124 107" stroke="#18130e" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Handlebar Mustache & Full Hipster Pointed Beard -->
    <path d="M144 127 C152 125 160 128 168 133 C160 136 152 136 146 134 C143 138 140 142 138 147 C145 150 152 156 154 164 C155 174 149 187 140 192 C134 187 131 178 129 170 C126 162 125 153 128 143 C129 137 135 131 144 127 Z"/>

    <!-- Negative Space Texture Lines in Beard -->
    <path d="M138 152 Q146 162 144 178" stroke="#ebd1b0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M133 146 Q137 158 134 172" stroke="#ebd1b0" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Bottom Ribbon Banner -->
  <g>
    <!-- Ribbon Fold Tails -->
    <polygon points="35,225 58,206 58,242 35,225" fill="#0d0a07"/>
    <polygon points="265,225 242,206 242,242 265,225" fill="#0d0a07"/>

    <!-- Main Curved Ribbon -->
    <path d="M50 210 Q150 198 250 210 L244 246 Q150 234 56 246 Z" fill="#18130e" stroke="#7c4e20" stroke-width="1.8"/>

    <!-- Text inside Ribbon: LC BARBER -->
    <text x="150" y="233" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="18" letter-spacing="5" fill="#fdf7ee" text-anchor="middle">LC BARBER</text>
  </g>
</svg>
