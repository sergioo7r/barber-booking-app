<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5dfbb"/>
      <stop offset="45%" stop-color="#c5a072"/>
      <stop offset="100%" stop-color="#8d6638"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1b18"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>
  </defs>

  <!-- Obsidian luxury squircle base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Inner delicate framing line -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="12" fill="none" stroke="url(#gold)" stroke-width="0.5" stroke-opacity="0.25"/>

  <!-- Bespoke Artisanal Emblem: Golden Shears & Barber Geometry -->
  <g>
    <!-- Scissor blades (refined editorial stroke) -->
    <path d="M21 44 L40 18" stroke="url(#gold)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M43 44 L24 18" stroke="url(#gold)" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Left loop -->
    <circle cx="20" cy="44" r="5" fill="none" stroke="url(#gold)" stroke-width="2.2"/>
    <!-- Right loop -->
    <circle cx="44" cy="44" r="5" fill="none" stroke="url(#gold)" stroke-width="2.2"/>

    <!-- Central solid pivot jewel -->
    <circle cx="32" cy="27.5" r="2.2" fill="url(#gold)"/>
    <circle cx="32" cy="27.5" r="0.8" fill="#0a0908"/>

    <!-- Artisan crown apex (Seville heritage crest accent) -->
    <path d="M28 13.5 L32 9.5 L36 13.5" fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
