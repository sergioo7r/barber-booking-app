<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Octagon / Decal warm leather-sand gradient -->
    <radialGradient id="decalBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#edd2b2"/>
      <stop offset="70%" stop-color="#d4a373"/>
      <stop offset="100%" stop-color="#b88452"/>
    </radialGradient>

    <!-- Path for arched top text -->
    <path id="archPath" d="M 32 108 A 74 74 0 0 1 168 108" fill="none" />
  </defs>

  <!-- Base Octagonal Badge with Soft Edges -->
  <polygon points="58,12 142,12 188,58 188,142 142,188 58,188 12,142 12,58" fill="url(#decalBg)" stroke="#8c5f34" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#6b4621" stroke-width="1" stroke-dasharray="2,3" opacity="0.4"/>

  <!-- Arched Text: THINK UNLIMITED BARBERSHOP -->
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="8.8" letter-spacing="2.2" fill="#1c1610">
    <textPath href="#archPath" startOffset="50%" text-anchor="middle">THINK UNLIMITED BARBERSHOP</textPath>
  </text>

  <!-- 7 Stars in Arc -->
  <g fill="#1c1610">
    <!-- Star 1 -->
    <polygon points="52,65 54,61 58,61 55,58 56,54 52,56 48,54 49,58 46,61 50,61" transform="rotate(-30 52 60) scale(0.9) translate(6, 6)"/>
    <!-- Star 2 -->
    <polygon points="66,51 68,47 72,47 69,44 70,40 66,42 62,40 63,44 60,47 64,47" transform="rotate(-20 66 46) scale(0.95) translate(4, 3)"/>
    <!-- Star 3 -->
    <polygon points="82,41 84,37 88,37 85,34 86,30 82,32 78,30 79,34 76,37 80,37" transform="rotate(-10 82 36) scale(1) translate(1, 1)"/>
    <!-- Star 4 (Apex) -->
    <polygon points="100,36 102.5,31.5 107,31.5 103.5,28 105,23.5 100,26 95,23.5 96.5,28 93,31.5 97.5,31.5" transform="scale(1.05) translate(-5, 0)"/>
    <!-- Star 5 -->
    <polygon points="118,41 120,37 124,37 121,34 122,30 118,32 114,30 115,34 112,37 116,37" transform="rotate(10 118 36) scale(1) translate(-1, 1)"/>
    <!-- Star 6 -->
    <polygon points="134,51 136,47 140,47 137,44 138,40 134,42 130,40 131,44 128,47 132,47" transform="rotate(20 134 46) scale(0.95) translate(-4, 3)"/>
    <!-- Star 7 -->
    <polygon points="148,65 150,61 154,61 151,58 152,54 148,56 144,54 145,58 142,61 146,61" transform="rotate(30 148 60) scale(0.9) translate(-6, 6)"/>
  </g>

  <!-- Speed / Precision Accent Lines -->
  <g stroke="#1c1610" stroke-width="2.4" stroke-linecap="round">
    <line x1="36" y1="92" x2="62" y2="92"/>
    <line x1="41" y1="99" x2="59" y2="99"/>
    <line x1="46" y1="106" x2="57" y2="106"/>

    <line x1="138" y1="92" x2="164" y2="92"/>
    <line x1="141" y1="99" x2="159" y2="99"/>
    <line x1="143" y1="106" x2="154" y2="106"/>
  </g>

  <!-- Center Icon: Gentleman Barber Profile Silhouette with Pompadour, Glasses & Hipster Beard -->
  <g fill="#1c1610">
    <!-- Pompadour / Hair -->
    <path d="M84 64 C80 50 88 44 100 44 C112 44 122 49 122 58 C122 62 119 66 117 68 C115 65 112 63 108 63 C101 63 94 66 90 71 C87 68 85 66 84 64 Z"/>
    
    <!-- Face structure, nose & ear -->
    <path d="M88 68 C88 68 91 66 95 66 C98 66 100 68 100 70 L98 75 L104 75 L106 82 L98 83 C98 85 96 87 93 88 C90 89 86 87 86 84 C84 83 82 80 82 77 C82 73 85 70 88 68 Z"/>

    <!-- Stylish Glasses / Sunglasses -->
    <path d="M89 72 Q97 70 105 73 Q107 77 104 80 Q97 82 91 79 Q88 76 89 72 Z" fill="#edd2b2" stroke="#1c1610" stroke-width="2.5"/>
    <path d="M89 74 L83 72" stroke="#1c1610" stroke-width="2" stroke-linecap="round"/>

    <!-- Mustache & Voluminous Barber Beard -->
    <path d="M96 85 C101 84 106 86 111 89 C106 91 101 91 97 90 C95 92 93 94 92 97 C96 99 101 103 102 108 C103 115 99 123 93 126 C89 123 87 117 86 112 C84 107 83 101 85 95 C86 91 90 87 96 85 Z"/>
    
    <!-- Fine beard accents (negative space hair strokes) -->
    <path d="M92 102 Q97 108 96 118" stroke="#edd2b2" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M88 98 Q91 106 89 114" stroke="#edd2b2" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Bottom Ribbon Banner -->
  <g>
    <!-- Ribbon tails -->
    <path d="M28 152 L44 140 L44 162 L28 152 Z" fill="#120e0a"/>
    <path d="M172 152 L156 140 L156 162 L172 152 Z" fill="#120e0a"/>
    
    <!-- Main Banner Body with Gentle Arc -->
    <path d="M38 143 Q100 136 162 143 L157 165 Q100 158 43 165 Z" fill="#1c1610" stroke="#b88452" stroke-width="1"/>
    
    <!-- Text inside Ribbon: LC BARBER -->
    <text x="100" y="156.5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="11.5" letter-spacing="3.5" fill="#f8eedf" text-anchor="middle">LC BARBER</text>
  </g>
</svg>
